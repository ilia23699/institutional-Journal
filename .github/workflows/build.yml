name: Build Institutional Journal

on:
  push:
    branches: ["main"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build placeholder
        run: |
          mkdir dist
          copy src\index.html dist\index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Institutional-Journal-Build
          path: dist
